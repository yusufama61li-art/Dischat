<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dischat</title>
<style>
:root{--bg:#1b1d2a;--p1:#242738;--p2:#2c3047;--p3:#383d5c;--tx:#eef0fb;--mu:#9aa0c3;--ac:#7c6cff;--ac2:#ff6b9d;--ok:#3ddc97;--er:#ff5c6c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eceefa;--p1:#ffffff;--p2:#f3f4fc;--p3:#dfe2f5;--tx:#1d2036;--mu:#5d6389}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hide{display:none!important}
.btn{background:var(--ac);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700}
.btn.g{background:var(--p3);color:var(--tx)}
.btn.r{background:var(--er)}
input{background:var(--p2);border:1px solid var(--p3);border-radius:10px;padding:10px 12px;width:100%}
/* auth */
#auth{height:100%;display:grid;place-items:center;padding:16px;overflow:auto}
.card{background:var(--p1);border-radius:18px;padding:26px;width:min(400px,100%);display:grid;gap:10px;box-shadow:0 10px 40px #0004}
.logo{font-size:34px;font-weight:900;letter-spacing:-1px}.logo b{color:var(--ac)}
.soc{display:flex;gap:8px;align-items:center;justify-content:center;background:var(--p2);border:1px solid var(--p3);padding:10px;border-radius:10px;font-weight:700;width:100%}
.or{color:var(--mu);text-align:center;font-size:13px}
.err{color:var(--er);min-height:18px;font-size:13px}
.lnk{color:var(--ac);font-weight:700}
/* app */
#app{height:100%;display:grid;grid-template-columns:68px 232px 1fr 220px}
.rail{background:var(--bg);padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:8px;overflow:auto;border-right:1px solid var(--p3)}
.ic{width:46px;height:46px;border-radius:50%;background:var(--p2);font-weight:800;display:grid;place-items:center;transition:border-radius .15s}
.ic:hover,.ic.on{border-radius:14px;background:var(--ac);color:#fff}
.side{background:var(--p1);display:flex;flex-direction:column;min-height:0}
.side h3{padding:14px;border-bottom:1px solid var(--p3);font-size:15px}
.list{overflow:auto;flex:1;padding:8px;display:grid;gap:2px;align-content:start}
.row{display:flex;gap:8px;align-items:center;padding:8px;border-radius:8px;text-align:left;width:100%;color:var(--mu)}
.row:hover,.row.on{background:var(--p3);color:var(--tx)}
.sec{font-size:12px;color:var(--mu);padding:10px 8px 2px;font-weight:700}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;position:relative}
.av i{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--p1)}
.me{display:flex;gap:8px;align-items:center;padding:10px;background:var(--bg);border-top:1px solid var(--p3)}
.me small{color:var(--mu);display:block;font-size:12px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{padding:13px 16px;border-bottom:1px solid var(--p3);display:flex;gap:10px;align-items:center;font-weight:800}
.top .sp{flex:1}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.m{display:flex;gap:10px}.m p{margin-top:2px;overflow-wrap:anywhere}.m small{color:var(--mu);margin-left:6px;font-weight:400}
.cin{padding:12px 16px}
.panel{padding:16px;overflow:auto;display:grid;gap:12px;align-content:start}
.idbox{background:var(--p2);border-radius:12px;padding:12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.idbox code{font-size:20px;font-weight:900;color:var(--ac2);letter-spacing:1px}
.add{display:flex;gap:8px}.add input{flex:1}
.mem{background:var(--p1);border-left:1px solid var(--p3);padding:10px;overflow:auto}
.vc{background:var(--p2);border-radius:14px;padding:16px;margin:16px;display:grid;gap:12px}
.part{display:flex;gap:12px;flex-wrap:wrap}
.pp{display:grid;gap:4px;justify-items:center;font-size:13px}
.pp .av{width:62px;height:62px;font-size:22px;transition:box-shadow .1s}
.pp .av.talk{box-shadow:0 0 0 4px var(--ok)}
.bar{height:6px;background:var(--p3);border-radius:4px;overflow:hidden}.bar div{height:100%;width:0;background:var(--ok)}
.call{position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:9}
.call .card{text-align:center;justify-items:center}
.call .av{width:92px;height:92px;font-size:34px}
.call .av.ring{animation:p 1.2s infinite}
@keyframes p{50%{box-shadow:0 0 0 14px #7c6cff44}}
@media (prefers-reduced-motion:reduce){.call .av.ring{animation:none}}
.back{display:none}
@media (max-width:820px){
 #app{grid-template-columns:58px 1fr}.mem{display:none}
 .main{position:fixed;inset:0;left:0;background:var(--bg);z-index:5;padding-top:env(safe-area-inset-top,0px)}
 .back{display:inline-block;color:var(--ac)}
 #app:not(.open) .main{display:none}
}
</style></head>
<body>
<section id="auth">
 <div class="card">
  <div class="logo">dis<b>chat</b></div>
  <p style="color:var(--mu)" id="atitle">Hesabına giriş yap</p>
  <button class="soc" data-s="Google">G&nbsp; Google ile devam et</button>
  <button class="soc" data-s="Facebook">f&nbsp; Facebook ile devam et</button>
  <button class="soc" data-s="Apple">&#63743;&nbsp; Apple ile devam et</button>
  <div class="or">veya e-posta ile</div>
  <input id="nm" placeholder="Kullanıcı adın" class="hide" autocomplete="nickname">
  <input id="em" type="email" placeholder="E-posta (örn. ali@gmail.com)" autocomplete="email">
  <input id="pw" type="password" placeholder="Şifre" autocomplete="current-password">
  <input id="pw2" type="password" placeholder="Şifreyi doğrula" class="hide" autocomplete="new-password">
  <div class="err" id="err"></div>
  <button class="btn" id="go">Giriş yap</button>
  <button class="lnk" id="sw">Hesabın yok mu? Kayıt ol</button>
 </div>
</section>

<section id="app" class="hide">
 <nav class="rail" id="rail"></nav>
 <aside class="side">
  <h3 id="sname">Direkt mesajlar</h3>
  <div class="list" id="slist"></div>
  <div class="me"><div class="av" id="meav"></div><div style="flex:1;min-width:0"><b id="mename"></b><small id="meid"></small></div><button class="btn g" id="out" title="Çıkış">Çıkış</button></div>
 </aside>
 <main class="main" id="main"></main>
 <aside class="mem" id="mem"></aside>
</section>

<div class="call hide" id="call"><div class="card"><div class="av" id="cav"></div><b id="cnm" style="font-size:20px"></b><span id="cst" style="color:var(--mu)"></span><button class="btn r" id="cend">Aramayı bitir</button></div></div>

<script>
const $=s=>document.querySelector(s);
const COL=['#7c6cff','#ff6b9d','#22b8cf','#f59f00','#51cf66','#e8590c'];
const col=s=>COL[[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%COL.length];
const av=(n,on)=>`<div class="av" style="background:${col(n)}">${n[0].toUpperCase()}${on?'<i></i>':''}</div>`;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const genId=()=>'DC-'+Math.floor(1000+Math.random()*9000);
// demo kullanıcılar (gerçek sunucu olmadığı için örnek hesaplar)
const people={'DC-1001':'Elif','DC-2002':'Mert','DC-3003':'Zeynep','DC-4004':'Can'};
const replies=['Selam! 👋','Tamam, olur.','Haha çok iyi 😄','Akşam sesliye girelim mi?','Bir bakayım, döneceğim.','Süper fikir!'];
let S={me:null,friends:[],dms:{},servers:[],view:{t:'dm',id:null},voice:null,stream:null,reg:false};
const accounts={};

// ---- AUTH ----
function setReg(r){S.reg=r;$('#nm').classList.toggle('hide',!r);$('#pw2').classList.toggle('hide',!r);
 $('#go').textContent=r?'Kayıt ol':'Giriş yap';$('#atitle').textContent=r?'Yeni hesap oluştur':'Hesabına giriş yap';
 $('#sw').textContent=r?'Zaten hesabın var mı? Giriş yap':'Hesabın yok mu? Kayıt ol';$('#err').textContent=''}
$('#sw').onclick=()=>setReg(!S.reg);
document.querySelectorAll('.soc').forEach(b=>b.onclick=()=>start({name:b.dataset.s+' Kullanıcısı',email:''}));
$('#go').onclick=()=>{
 const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value,e=$('#err');
 if(!/^\S+@\S+\.\S+$/.test(em))return e.textContent='Geçerli bir e-posta yaz.';
 if(S.reg){
  const nm=$('#nm').value.trim();
  if(nm.length<2)return e.textContent='Kullanıcı adı en az 2 karakter olmalı.';
  if(pw.length<6)return e.textContent='Şifre en az 6 karakter olmalı.';
  if(pw!==$('#pw2').value)return e.textContent='Şifreler aynı değil.';
  if(accounts[em])return e.textContent='Bu e-posta zaten kayıtlı.';
  accounts[em]={name:nm,pw,id:genId()};start({...accounts[em],email:em});
 }else{
  const a=accounts[em];
  if(!a||a.pw!==pw)return e.textContent='E-posta veya şifre yanlış. Hesabın yoksa kayıt ol.';
  start({...a,email:em});
 }};
function start(u){
 S.me={name:u.name,id:u.id||genId()};S.friends=[];S.dms={};
 S.servers=[{id:'s1',name:'Benim Sunucum',text:['genel','sohbet'],voice:['Sesli Oda 1','Sesli Oda 2'],msgs:{genel:[{u:'dischat',t:'Sunucuna hoş geldin! Soldan kanal seçebilirsin.'}],sohbet:[]}}];
 S.view={t:'dm',id:null};
 $('#auth').classList.add('hide');$('#app').classList.remove('hide');
 $('#meav').outerHTML=av(S.me.name).replace('class="av"','class="av" id="meav"');
 $('#mename').textContent=S.me.name;$('#meid').textContent='ID: '+S.me.id;render();
}
$('#out').onclick=()=>{leaveVoice();$('#app').classList.add('hide');$('#auth').classList.remove('hide');$('#pw').value='';$('#pw2').value=''};

// ---- RENDER ----
function render(){
 $('#app').classList.remove('open');
 $('#rail').innerHTML=`<button class="ic ${S.view.t==='dm'?'on':''}" id="rdm" title="Direkt mesajlar">DM</button>`+
  S.servers.map(s=>`<button class="ic ${S.view.sid===s.id?'on':''}" data-sv="${s.id}" title="${esc(s.name)}">${esc(s.name[0].toUpperCase())}</button>`).join('')+
  `<button class="ic" id="newsv" title="Sunucu kur" style="color:var(--ok)">+</button>`;
 $('#rdm').onclick=()=>{S.view={t:'dm',id:null};render()};
 $('#newsv').onclick=()=>{const n=prompt('Sunucu adı:');if(n&&n.trim()){const id='s'+Date.now();S.servers.push({id,name:n.trim(),text:['genel'],voice:['Sesli Oda'],msgs:{genel:[]}});S.view={t:'sv',sid:id,ch:'genel'};render()}};
 document.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>{const s=S.servers.find(x=>x.id===b.dataset.sv);S.view={t:'sv',sid:s.id,ch:s.text[0]};render()});
 S.view.t==='dm'?renderDM():renderSV();
}
function renderDM(){
 $('#sname').textContent='Direkt mesajlar';
 $('#slist').innerHTML=`<button class="row ${!S.view.id?'on':''}" id="fr">👥 Arkadaşlar</button><div class="sec">Mesajlar</div>`+
  (S.friends.length?S.friends.map(f=>`<button class="row ${S.view.id===f.id?'on':''}" data-f="${f.id}">${av(f.name,1)}<span>${esc(f.name)}</span></button>`).join(''):'<p style="color:var(--mu);padding:8px;font-size:13px">Henüz kimse yok. Arkadaş ekle.</p>');
 $('#fr').onclick=()=>{S.view.id=null;render()};
 document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.view.id=b.dataset.f;render();$('#app').classList.add('open')});
 $('#mem').innerHTML='';
 const m=$('#main');
 if(!S.view.id){
  m.innerHTML=`<div class="top">Arkadaşlar</div><div class="panel">
   <div class="idbox"><div><small style="color:var(--mu)">Senin ID numaran</small><br><code>${S.me.id}</code></div><button class="btn g" id="cp">Kopyala</button></div>
   <div><b>Arkadaş ekle</b><div class="add" style="margin-top:8px"><input id="fid" placeholder="Arkadaşının ID numarası (örn. DC-1001)"><button class="btn" id="fadd">Ekle</button></div><div class="err" id="ferr" style="margin-top:6px"></div>
   <small style="color:var(--mu)">Deneme için şu ID’leri kullanabilirsin: DC-1001, DC-2002, DC-3003, DC-4004</small></div>
   <b>Arkadaş listesi (${S.friends.length})</b>
   ${S.friends.map(f=>`<div class="idbox"><div style="display:flex;gap:10px;align-items:center">${av(f.name,1)}<div><b>${esc(f.name)}</b><br><small style="color:var(--mu)">${f.id}</small></div></div><button class="btn g" data-o="${f.id}">Mesaj</button></div>`).join('')}
   </div>`;
  $('#cp').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(S.me.id).catch(()=>{});$('#cp').textContent='Kopyalandı'};
  $('#fadd').onclick=addFriend;$('#fid').onkeydown=e=>e.key==='Enter'&&addFriend();
  document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{S.view.id=b.dataset.o;render();$('#app').classList.add('open')});
 }else{
  const f=S.friends.find(x=>x.id===S.view.id);const arr=S.dms[f.id]=S.dms[f.id]||[];
  m.innerHTML=`<div class="top"><button class="back" id="bk">←</button>${av(f.name,1)}<span>${esc(f.name)}</span><span class="sp"></span><button class="btn" id="callb">📞 Ara</button></div>
   <div class="msgs" id="msgs">${arr.length?'':'<p style="color:var(--mu)">'+esc(f.name)+' ile sohbetin başlangıcı. Bir şey yaz!</p>'}${arr.map(msgHtml).join('')}</div>
   <div class="cin"><input id="ci" placeholder="${esc(f.name)} kişisine mesaj yaz" autocomplete="off"></div>`;
  $('#bk').onclick=()=>$('#app').classList.remove('open');
  $('#callb').onclick=()=>doCall(f);
  $('#ci').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim()){arr.push({u:S.me.name,t:e.target.value.trim()});e.target.value='';render();$('#app').classList.add('open');
   setTimeout(()=>{arr.push({u:f.name,t:replies[Math.floor(Math.random()*replies.length)]});if(S.view.id===f.id){render();$('#app').classList.add('open')}},900)}};
  const ms=$('#msgs');ms.scrollTop=ms.scrollHeight;$('#ci').focus();
 }
}
const msgHtml=x=>`<div class="m">${av(x.u)}<div><b>${esc(x.u)}</b><small>${x.u===S.me.name?'sen':''}</small><p>${esc(x.t)}</p></div></div>`;
function addFriend(){
 const id=$('#fid').value.trim().toUpperCase(),e=$('#ferr');
 if(!id)return e.textContent='Bir ID yaz.';
 if(id===S.me.id)return e.textContent='Kendini ekleyemezsin.';
 if(S.friends.some(f=>f.id===id))return e.textContent='Bu kişi zaten arkadaşın.';
 if(!people[id])return e.textContent='Bu ID ile kullanıcı bulunamadı.';
 S.friends.push({id,name:people[id]});render();
}
function renderSV(){
 const s=S.servers.find(x=>x.id===S.view.sid);
 $('#sname').textContent=s.name;
 $('#slist').innerHTML=`<div class="sec">Yazı kanalları</div>`+s.text.map(c=>`<button class="row ${S.view.ch===c?'on':''}" data-c="${c}"># ${esc(c)}</button>`).join('')+
  `<div class="sec">Sesli kanallar</div>`+s.voice.map(c=>`<button class="row ${S.voice&&S.voice.v===c&&S.voice.s===s.id?'on':''}" data-v="${c}">🔊 ${esc(c)}</button>`).join('')+
  `<button class="row" id="addch" style="color:var(--ok)">+ Kanal ekle</button>`;
 document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.view.ch=b.dataset.c;render();$('#app').classList.add('open')});
 document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>joinVoice(s,b.dataset.v));
 $('#addch').onclick=()=>{const n=prompt('Kanal adı:');if(!n||!n.trim())return;const t=confirm('Sesli kanal olsun mu? (Tamam = sesli, İptal = yazı)');const nm=n.trim().toLowerCase().replace(/\s+/g,'-');
  if(t)s.voice.push(n.trim());else{s.text.push(nm);s.msgs[nm]=[]}render()};
 $('#mem').innerHTML=`<div class="sec">Çevrimiçi — ${1+s.voice.length*0+S.friends.length}</div><div class="row">${av(S.me.name,1)}<span style="color:var(--tx)">${esc(S.me.name)}</span></div>`+S.friends.map(f=>`<div class="row">${av(f.name,1)}<span>${esc(f.name)}</span></div>`).join('');
 const m=$('#main');const inVoice=S.voice&&S.voice.s===s.id;
 const arr=s.msgs[S.view.ch]||[];
 m.innerHTML=`<div class="top"><button class="back" id="bk">←</button># ${esc(S.view.ch)}<span class="sp"></span>${S.friends.length?'<button class="btn g" id="inv">Arkadaş davet et</button>':''}</div>
  ${inVoice?voiceHtml():''}
  <div class="msgs" id="msgs">${arr.map(msgHtml).join('')}</div>
  <div class="cin"><input id="ci" placeholder="#${esc(S.view.ch)} kanalına mesaj yaz" autocomplete="off"></div>`;
 $('#bk').onclick=()=>$('#app').classList.remove('open');
 $('#ci').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim()){arr.push({u:S.me.name,t:e.target.value.trim()});e.target.value='';render();$('#app').classList.add('open')}};
 if($('#inv'))$('#inv').onclick=()=>{S.friends.forEach(f=>{if(S.voice&&S.voice.s===s.id&&!S.voice.p.includes(f.name))S.voice.p.push(f.name)});render();$('#app').classList.add('open')};
 if(inVoice)bindVoice();
 const ms=$('#msgs');ms.scrollTop=ms.scrollHeight;
}
// ---- SESLİ ----
function voiceHtml(){const v=S.voice;return `<div class="vc"><b>🔊 ${esc(v.v)} — bağlandın</b>
 <div class="part">${[S.me.name,...v.p].map((n,i)=>`<div class="pp"><div class="av ${i===0?'':''}" style="background:${col(n)}" data-p="${esc(n)}">${n[0].toUpperCase()}</div>${esc(n)}</div>`).join('')}</div>
 <div class="bar"><div id="lvl"></div></div><small id="vnote" style="color:var(--mu)">${v.note||''}</small>
 <div style="display:flex;gap:8px"><button class="btn g" id="mute">${v.mute?'🔇 Sessizdesin':'🎙️ Mikrofon açık'}</button><button class="btn r" id="leave">Ayrıl</button></div></div>`}
async function joinVoice(s,v){
 leaveVoice();S.voice={s:s.id,v,p:S.friends.slice(0,2).map(f=>f.name),mute:false,note:'Mikrofon izni isteniyor…'};
 S.view.sid=s.id;render();$('#app').classList.add('open');
 try{
  S.stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const ac=new (window.AudioContext||window.webkitAudioContext)(),src=ac.createMediaStreamSource(S.stream),an=ac.createAnalyser();an.fftSize=256;src.connect(an);
  S.ac=ac;const d=new Uint8Array(an.frequencyBinCount);
  S.voice.note='Mikrofon çalışıyor. Konuşunca çubuk hareket eder.';const n=$('#vnote');if(n)n.textContent=S.voice.note;
  (function tick(){if(!S.stream)return;an.getByteFrequencyData(d);const l=Math.min(100,d.reduce((a,b)=>a+b,0)/d.length*2.2);
   const b=$('#lvl');if(b)b.style.width=(S.voice.mute?0:l)+'%';const me=document.querySelector(`[data-p="${CSS.escape(S.me.name)}"]`);if(me)me.classList.toggle('talk',!S.voice.mute&&l>18);requestAnimationFrame(tick)})();
 }catch(e){S.voice.note='Mikrofon açılamadı (izin verilmedi ya da bu ortamda kapalı). Kanalda yine de görünürsün.';const n=$('#vnote');if(n)n.textContent=S.voice.note}
}
function bindVoice(){$('#mute').onclick=()=>{S.voice.mute=!S.voice.mute;if(S.stream)S.stream.getAudioTracks().forEach(t=>t.enabled=!S.voice.mute);render();$('#app').classList.add('open')};$('#leave').onclick=()=>{leaveVoice();render();$('#app').classList.add('open')}}
function leaveVoice(){if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}if(S.ac){S.ac.close().catch(()=>{});S.ac=null}S.voice=null}
// ---- ARAMA ----
let ct;
function doCall(f){
 $('#call').classList.remove('hide');$('#cav').outerHTML=av(f.name).replace('class="av"','class="av ring" id="cav"');$('#cnm').textContent=f.name;$('#cst').textContent='Aranıyor…';
 clearTimeout(ct);let sec=0;ct=setTimeout(()=>{$('#cst').textContent='Görüşme sürüyor 00:00';ct=setInterval(()=>{sec++;$('#cst').textContent='Görüşme sürüyor '+String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')},1000)},2200);
}
$('#cend').onclick=()=>{clearTimeout(ct);clearInterval(ct);$('#call').classList.add('hide')};
</script>
</body></html>
